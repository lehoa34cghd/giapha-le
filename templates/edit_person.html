{% extends 'base.html' %}{% block content %}<div class="formbox"><h2>{{'Sửa thông tin' if p else 'Thêm người'}}</h2><form method="post"><label>Họ tên</label><input name="name" required value="{{p.name if p else ''}}"><label>Vai vế</label><input name="title" value="{{p.title if p else ''}}"><label>Năm sinh</label><input name="birth" value="{{p.birth if p else ''}}"><label>Năm mất</label><input name="death" value="{{p.death if p else ''}}"><label>Thuộc nhánh của ai</label><select name="parent_id"><option value="">Không chọn</option>{% for x in people %}<option value="{{x.id}}" {% if parent_id|string==x.id|string %}selected{% endif %}>{{x.name}}</option>{% endfor %}</select><label>Vợ/chồng của ai</label><select name="spouse_id"><option value="">Không chọn</option>{% for x in people %}<option value="{{x.id}}" {% if spouse_id|string==x.id|string %}selected{% endif %}>{{x.name}}</option>{% endfor %}</select><label>Ghi chú</label><textarea name="note">{{p.note if p else ''}}</textarea><button>Lưu</button><a href="/?mode=edit">Quay lại</a></form></div>{% endblock %}
