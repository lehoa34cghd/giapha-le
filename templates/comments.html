{% extends 'base.html' %}{% block content %}<div class="formbox"><h2>Góp ý</h2><form method="post"><textarea name="content" required placeholder="Nhập góp ý cần sửa..."></textarea><button>Gửi góp ý</button></form>{% for c in comments %}<div class="comment"><b>{{c.username}}</b> - {{c.created_at}}<p>{{c.content}}</p><small>{{c.status}}</small>{% if session.role=='admin' and c.status=='new' %}<a href="/comment/{{c.id}}/done">Đã xử lý</a>{% endif %}</div>{% endfor %}<a href="/">Quay lại</a></div>{% endblock %}
